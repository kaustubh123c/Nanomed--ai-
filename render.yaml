services:
  - type: web
    name: radshield-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: nanomed_ai
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: MAC_DATA_SOURCE
        value: xcom
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
